spring:
  application:
    name: library-backend
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
  sql:
    init:
      mode: embedded
  jpa:
    open-in-view: false
    hibernate:
      # schema.sql creates the tables (spring.sql.init); Hibernate only validates the mapping (D2, architecture 10.4).
      ddl-auto: validate
  h2:
    console:
      enabled: false

server:
  port: 8080
  address: 127.0.0.1
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # Hibernate logs the violated row values (names, emails) at ERROR for constraint violations; the services translate
    # those violations into API errors, so the raw log line adds nothing but personal data (DR-14).
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

library:
  demo-data:
    enabled: true
  security:
    # If server.port or the Vite dev port changes, change both lists too (README, R-12).
    allowed-hosts: localhost:8080,127.0.0.1:8080,localhost:5173,127.0.0.1:5173
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
